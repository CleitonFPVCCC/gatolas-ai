<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Gatolas AI</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: "Orbitron", sans-serif;
    background: radial-gradient(circle, #020617, #000);
    color: #00eaff;
    overflow: hidden;
}

/* BACKGROUND HEX */
body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background:
        linear-gradient(60deg, #00eaff0a 1px, transparent 1px),
        linear-gradient(-60deg, #00eaff0a 1px, transparent 1px);
    background-size: 60px 100px;
    pointer-events: none;
}

/* LAYOUT */
.container {
    display: flex;
    justify-content: space-between;
    padding: 20px;
    position: relative;
    z-index: 2;
}

/* PAINEL */
.panel {
    width: 240px;
    padding: 15px;
    border-radius: 10px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(0,234,255,0.2);
}

/* TITULO */
.panel h2, .panel h3 {
    border-bottom: 1px solid #00eaff30;
}

/* CLIQUE */
.panel p {
    cursor: pointer;
}

.panel p:hover {
    color: #00ffcc;
}

/* STATUS */
.dot {
    width: 8px;
    height: 8px;
    background: #00ff88;
    border-radius: 50%;
    display: inline-block;
}

/* RADAR */
.radar {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    border: 2px solid #00eaff30;
    position: relative;
    margin: auto;
    box-shadow: 0 0 20px #00eaff20;
}

.radar::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 1px solid #00eaff20;
}

.sweep {
    position: absolute;
    width: 50%;
    height: 2px;
    background: #00eaff;
    top: 50%;
    left: 50%;
    transform-origin: left;
    animation: rotate 4s linear infinite;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* CHAT */
#chat {
    width: 90%;
    margin: 15px auto;
    height: 200px;
    overflow-y: auto;
    padding: 10px;
    background: rgba(0,0,0,0.7);
    border-radius: 10px;
    font-family: "Share Tech Mono", monospace;
}

/* CURSOR */
.cursor::after {
    content: " █";
    animation: blink 1s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

/* INPUT */
.input-area {
    display: flex;
    justify-content: center;
    gap: 10px;
    position: relative;
    z-index: 5;
}

input {
    width: 60%;
    padding: 10px;
    background: black;
    border: 1px solid #00eaff;
    color: #00eaff;
}

button {
    padding: 10px 20px;
    background: transparent;
    border: 1px solid #00eaff;
    color: #00eaff;
    cursor: pointer;
}

/* ENERGY BAR */
.energy {
    width: 90%;
    height: 5px;
    background: #001;
    margin: 10px auto;
    border: 1px solid #00eaff30;
}

.energy-bar {
    height: 100%;
    width: 30%;
    background: #00eaff;
    animation: energy 3s infinite;
}

@keyframes energy {
    0% { width: 20%; }
    50% { width: 80%; }
    100% { width: 20%; }
}

</style>
</head>

<body>

<div class="container">

<div class="panel">
    <h2>GATOLAS AI</h2>
    <p onclick="infoSistema()"><span class="dot"></span> Sistema</p>
    <p onclick="infoStatus()">Status</p>
    <p onclick="infoModelo()">Modelo</p>
    <p onclick="infoConexao()">Conexão</p>
</div>

<div class="radar">
    <div class="sweep"></div>
</div>

<div class="panel">
    <h3>COMANDOS</h3>
    <p onclick="limpar()">/limpar</p>
    <p onclick="ajuda()">/ajuda</p>
    <p onclick="memoria()">/memoria</p>
</div>

</div>

<div class="energy">
    <div class="energy-bar"></div>
</div>

<div id="chat"></div>

<div class="input-area">
    <input id="pergunta" placeholder="Digite comando...">
    <button onclick="enviar()">EXEC</button>
</div>

<script>

const chat = document.getElementById("chat")
const input = document.getElementById("pergunta")

function adicionar(texto) {
    document.querySelectorAll(".cursor").forEach(el => el.classList.remove("cursor"))

    let linha = document.createElement("p")
    linha.classList.add("cursor")
    linha.textContent = "> " + texto

    chat.appendChild(linha)
    chat.scrollTop = chat.scrollHeight
}

input.addEventListener("keypress", e => {
    if (e.key === "Enter") enviar()
})

async function enviar() {
    let texto = input.value
    if(!texto) return

    adicionar("Você: " + texto)
    input.value = ""

    // loading real
    adicionar("Gatolas: processando...")

    let resposta = await fetch("https://gatolas-ai.onrender.com/perguntar", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({texto})
    })

    let data = await resposta.json()

    adicionar("Gatolas: " + data.resposta)
}

/* INFO */
function infoSistema(){ adicionar("Sistema online.") }
function infoStatus(){ adicionar("Serviços ativos.") }
function infoModelo(){ adicionar("Modelo GPT ativo.") }
function infoConexao(){ adicionar("Conexão estável.") }

function limpar(){ chat.innerHTML = "" }
function ajuda(){ adicionar("Use comandos básicos.") }
function memoria(){ adicionar("Memória em desenvolvimento.") }

</script>

</body>
</html>

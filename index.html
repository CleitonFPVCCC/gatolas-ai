<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Gatolas AI</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: "Orbitron", sans-serif;
    background: radial-gradient(circle, #020617, #000);
    color: #00eaff;
    overflow: hidden;
}

/* HEX REAL MAIS LIMPO */
body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background-image:
        linear-gradient(60deg, #00eaff0a 1px, transparent 1px),
        linear-gradient(-60deg, #00eaff0a 1px, transparent 1px),
        linear-gradient(0deg, #00eaff08 1px, transparent 1px);
    background-size: 60px 100px;
    opacity: 0.15;
}

/* HUD LINES */
body::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
        transparent,
        transparent 2px,
        rgba(0,234,255,0.03) 3px
    );
    pointer-events: none;
}

/* LAYOUT */
.container {
    display: flex;
    justify-content: space-between;
    padding: 20px;
    position: relative;
    z-index: 1;
}

/* PAINEL */
.panel {
    width: 240px;
    padding: 18px;
    border-radius: 12px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(0,234,255,0.2);
    position: relative;
    overflow: hidden;
}

/* BORDA ANIMADA COMPLETA (MINHOCA) */
.panel::after {
    content: "";
    position: absolute;
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00eaff, transparent);
    animation: snake 6s linear infinite;
}

/* CAMINHO COMPLETO */
@keyframes snake {
    0%   { top: 0; left: -120px; }
    25%  { top: 0; left: 100%; }
    26%  { top: -120px; left: 100%; transform: rotate(90deg); }
    50%  { top: 100%; left: 100%; transform: rotate(90deg); }
    51%  { top: 100%; left: 100%; transform: rotate(180deg); }
    75%  { top: 100%; left: -120px; transform: rotate(180deg); }
    76%  { top: 100%; left: -120px; transform: rotate(270deg); }
    100% { top: -120px; left: -120px; transform: rotate(270deg); }
}

/* TITULOS */
.panel h2, .panel h3 {
    margin-top: 0;
    border-bottom: 1px solid #00eaff30;
}

/* STATUS */
.dot {
    width: 8px;
    height: 8px;
    background: #00ff88;
    border-radius: 50%;
    display: inline-block;
}

/* LOGO */
.logo img {
    width: 380px;
    mix-blend-mode: screen;
    filter: drop-shadow(0 0 40px #00eaff);
    animation: pulse 3s infinite;
}

@keyframes pulse {
    50% { transform: scale(1.05); }
}

/* CHAT */
#chat {
    width: 90%;
    margin: 15px auto;
    height: 230px;
    overflow-y: auto;
    padding: 10px;
    background: rgba(0,0,0,0.7);
    border-radius: 10px;
    border: 1px solid rgba(0,234,255,0.3);
    font-family: "Share Tech Mono", monospace;
}

/* CURSOR */
.cursor::after {
    content: " █";
    animation: blink 1s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

/* INPUT */
.input-area {
    display: flex;
    justify-content: center;
    gap: 10px;
}

input {
    width: 60%;
    padding: 12px;
    background: black;
    border: 1px solid #00eaff;
    color: #00eaff;
    border-radius: 6px;
}

input:focus {
    box-shadow: 0 0 15px #00eaff;
}

button {
    padding: 12px 25px;
    background: transparent;
    border: 1px solid #00eaff;
    color: #00eaff;
    cursor: pointer;
}

button:hover {
    background: #00eaff20;
}

/* CLIQUE */
.panel p {
    cursor: pointer;
}

.panel p:hover {
    color: #00ffcc;
}

</style>
</head>

<body>

<div class="container">

<div class="panel">
    <h2>GATOLAS AI</h2>
    <p onclick="infoSistema()"><span class="dot"></span> Sistema</p>
    <p onclick="infoStatus()">Status</p>
    <p onclick="infoModelo()">Modelo</p>
    <p onclick="infoConexao()">Conexão</p>
</div>

<div class="logo">
    <img src="Gatolas.png">
</div>

<div class="panel">
    <h3>COMANDOS</h3>
    <p onclick="limpar()">/limpar</p>
    <p onclick="ajuda()">/ajuda</p>
    <p onclick="memoria()">/memoria</p>
</div>

</div>

<div id="chat"></div>

<div class="input-area">
    <input id="pergunta" placeholder="Digite comando...">
    <button onclick="enviar()">EXEC</button>
</div>

<script>

const chat = document.getElementById("chat")
const input = document.getElementById("pergunta")

function adicionar(texto) {
    document.querySelectorAll(".cursor").forEach(el => el.classList.remove("cursor"))

    let linha = document.createElement("p")
    linha.classList.add("cursor")
    linha.textContent = "> " + texto

    chat.appendChild(linha)
    chat.scrollTop = chat.scrollHeight
}

input.addEventListener("keypress", e => {
    if (e.key === "Enter") enviar()
})

async function enviar() {
    let texto = input.value
    if(!texto) return

    adicionar("Você: " + texto)
    input.value = ""

    let resposta = await fetch("https://gatolas-ai.onrender.com/perguntar", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({texto})
    })

    let data = await resposta.json()
    adicionar("Gatolas: " + data.resposta)
}

/* INFO */
function infoSistema(){ adicionar("Sistema online e operacional.") }
function infoStatus(){ adicionar("Serviços ativos.") }
function infoModelo(){ adicionar("GPT-4o-mini em execução.") }
function infoConexao(){ adicionar("Conexão estável.") }

function limpar(){ chat.innerHTML = "" }
function ajuda(){ adicionar("Use /limpar, /memoria.") }
function memoria(){ adicionar("Memória em desenvolvimento.") }

</script>

</body>
</html>
